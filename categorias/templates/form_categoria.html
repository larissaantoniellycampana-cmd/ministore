{% extends 'base.html' %}

{% block title %}
    {{ 'Editar' if categoria else 'Novo' }} Categoria — MiniStore
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if categoria else 'Novo' }} Categoria</h1>
</div>

{% if categoria %}
<form action="{{ url_for('categorias.editar', id=categoria.id) }}" method="POST">
{% else %}
<form action="{{ url_for('categorias.novo') }}" method="POST">
{% endif %}

    <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome"
               class="form-control"
               value="{{ categoria.nome if categoria else '' }}"
               required>
    </div>

    <div class="form-group">
        <label for="descricao">Descricao</label>
        <input type="descricao" id="descricao" name="descricao"
               class="form-control"
               value="{{ categoria.descricao|default('') }}">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            {{ 'Salvar' if categoria else 'Cadastrar' }}
        </button>
        <a href="{{ url_for('categorias.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>

</form>
{% endblock %}
